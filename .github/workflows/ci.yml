name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reven-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reven_test
          POSTGRES_USER: reven_test
          POSTGRES_PASSWORD: reven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reven_test -d reven_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://reven_test:reven_test@127.0.0.1:5432/reven_test
      TEST_DATABASE_URL: postgresql+asyncpg://reven_test:reven_test@127.0.0.1:5432/reven_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check server
      - run: uv run ruff format --check server
      - run: uv run mypy server/src
      - run: uv run pytest server/tests

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reven_migration
          POSTGRES_USER: reven_migration
          POSTGRES_PASSWORD: reven_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reven_migration -d reven_migration"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://reven_migration:reven_migration@127.0.0.1:5432/reven_migration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev --all-packages
      - run: uv run alembic -c server/migrations/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reven/web test --run
      - run: pnpm --filter @reven/web exec tsc -b
      - run: pnpm --filter @reven/web build

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reven/renderer test
      - run: pnpm --filter @reven/renderer build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f infra/docker/Dockerfile -t reven:test .
      - run: echo '{"markdown":"# smoke"}' | docker run --rm -i reven:test node /app/renderer/dist/cli.mjs
      - run: docker run --rm reven:test ruby --version
      - run: docker run --rm reven:test bundle --version
      - name: Validate Compose and Caddy
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml config >/dev/null
          docker run --rm \
            -e REVEN_BASIC_AUTH_USER=smoke \
            -e 'CADDY_BASIC_AUTH_HASH=$2a$14$abcdefghijklmnopqrstuuuuuuuuuuuuuuuuuuuuuuuuuuuu' \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Verify non-root runtime and OS sandbox
        run: |
          test "$(docker run --rm reven:test id -u)" = "10001"
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=infra/docker/seccomp-bwrap.json \
            reven:test \
            python -c "import asyncio; from pathlib import Path; \
            from reven.publishing.wechat.renderer import WechatRenderer; \
            asyncio.run(WechatRenderer('node', Path('/app/renderer/dist/cli.mjs'), \
            sandbox_executable=Path('/usr/bin/bwrap')).render('# sandbox'))"
      - name: Verify sandbox denies network, application data and writes
        run: |
          docker run --rm --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=infra/docker/seccomp-bwrap.json \
            reven:test bwrap --die-with-parent --new-session --unshare-all \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind /etc /etc --dev /dev --tmpfs /proc --tmpfs /tmp -- \
            node -e 'const fs=require("fs");let blocked=0;
            for(const p of ["/data/secret","/app/server","/proc/1/environ"])
            {try{fs.readFileSync(p)}catch{blocked++}}
            try{fs.writeFileSync("/usr/escape","x")}catch{blocked++}
            fetch("https://example.com").then(()=>process.exit(9))
            .catch(()=>process.exit(blocked===4?0:8));
            setTimeout(()=>process.exit(7),3000)'
