name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: server/src

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check server/ bot/ packages/

      - name: ruff format
        run: uv run ruff format --check server/ bot/ packages/

      - name: mypy
        run: uv run mypy server/src/ bot/src/ packages/

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest -v
