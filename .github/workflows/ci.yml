name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reven-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: reven_test
          POSTGRES_USER: reven_test
          POSTGRES_PASSWORD: reven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reven_test -d reven_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://reven_test:reven_test@127.0.0.1:5432/reven_test
      TEST_DATABASE_URL: postgresql+asyncpg://reven_test:reven_test@127.0.0.1:5432/reven_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check server
      - run: uv run ruff format --check server
      - run: uv run mypy server/src
      - run: uv run pytest server/tests --cov=reven --cov-report=term-missing --cov-fail-under=80

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: reven_migration
          POSTGRES_USER: reven_migration
          POSTGRES_PASSWORD: reven_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reven_migration -d reven_migration"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://reven_migration:reven_migration@127.0.0.1:5432/reven_migration
      TEST_DATABASE_URL: postgresql+asyncpg://reven_migration:reven_migration@127.0.0.1:5432/reven_migration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages
      - run: uv run alembic -c server/migrations/alembic.ini upgrade head
      - run: uv run pytest server/tests/migrations/test_notification_outbox_migration.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reven/web test --run
      - run: pnpm --filter @reven/web exec tsc -b
      - run: pnpm --filter @reven/web build

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reven/renderer test
      - run: pnpm --filter @reven/renderer build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --pull --no-cache -f infra/docker/Dockerfile -t reven:test .
      - run: echo '{"markdown":"# smoke"}' | docker run --rm -i reven:test node /app/renderer/dist/cli.mjs
      - run: docker run --rm reven:test ruby --version
      - run: docker run --rm reven:test bundle --version
      - name: Validate Compose and Caddy
        run: |
          cp .env.example .env
          set -a
          . ./.env
          set +a
          ./scripts/validate_reven_image.sh
          docker compose --env-file .env -f infra/compose/docker-compose.yml config >/dev/null
          docker run --rm \
            -e REVEN_BASIC_AUTH_USER=smoke \
            -e 'CADDY_BASIC_AUTH_HASH=$2a$14$abcdefghijklmnopqrstuuuuuuuuuuuuuuuuuuuuuuuuuuuu' \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Verify non-root runtime and renderer sandbox
        run: |
          test "$(docker run --rm reven:test id -u)" = "10001"
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=infra/docker/seccomp-bwrap.json \
            reven:test \
            python -c "import asyncio; from pathlib import Path; \
            from reven.publishing.wechat.renderer import WechatRenderer; \
            asyncio.run(WechatRenderer('node', Path('/app/renderer/dist/cli.mjs'), \
            sandbox_executable=Path('/usr/bin/bwrap')).render('# sandbox'))"
      - name: Verify production blog sandbox and resource limits
        run: |
          docker volume create reven-ci-security
          docker run --rm --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=infra/docker/seccomp-bwrap.json \
            --memory=2g --cpus=2 --pids-limit=128 --tmpfs /tmp:size=256m \
            -v reven-ci-security:/data \
            -v "$PWD/server/tests/fixtures/blog:/fixture:ro" \
            -v "$PWD/scripts/container_security_smoke.py:/smoke.py:ro" \
            reven:test python /smoke.py
          docker volume rm reven-ci-security
      - name: Verify migration failure preserves current static release
        run: |
          docker volume create reven-ci-static
          docker run --rm -v reven-ci-static:/srv/reven \
            reven:test sh -c 'mkdir -p /srv/reven/releases/old &&
            ln -s releases/old /srv/reven/current'
          if docker run --rm --read-only --tmpfs /tmp:size=256m \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --security-opt=seccomp=infra/docker/seccomp-bwrap.json \
            -v reven-ci-static:/srv/reven -v reven-ci-security-data:/data \
            -e DATABASE_URL=postgresql+asyncpg://invalid:invalid@127.0.0.1:1/invalid \
            -e REVEN_MASTER_KEY=dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ= \
            reven:test; then
            exit 1
          fi
          test "$(docker run --rm -v reven-ci-static:/srv/reven \
            reven:test readlink /srv/reven/current)" = "releases/old"
          docker volume rm reven-ci-static reven-ci-security-data
      - name: Generate container SBOM
        run: |
          docker volume create reven-trivy-cache
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v reven-trivy-cache:/root/.cache/trivy \
            -v "$PWD:/work" \
            aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e \
            image --scanners vuln \
            --format cyclonedx --output /work/reven-sbom.cdx.json reven:test
      - name: Scan fixed critical container vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v reven-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e \
            image --scanners vuln \
            --exit-code 1 --ignore-unfixed --severity CRITICAL reven:test
          docker volume rm reven-trivy-cache
      - name: Upload container SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reven-container-sbom
          path: reven-sbom.cdx.json
