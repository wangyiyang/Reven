name: Release and Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a version image or roll back to the prior healthy image.
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
      version:
        description: Version tag to deploy (e.g. v0.3.0); defaults to latest for deploy.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reven-production
  cancel-in-progress: false

env:
  IMAGE: registry.cn-hangzhou.aliyuncs.com/wangyiyang/reven

jobs:
  quality-gate:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  image:
    if: github.event_name == 'push'
    needs: quality-gate
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to Alibaba ACR
        env:
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
        run: |
          printf '%s' "$ACR_PASSWORD" | \
            docker login registry.cn-hangzhou.aliyuncs.com \
              --username "$ACR_USERNAME" --password-stdin
      - name: Validate semver tag and refuse an existing version image
        run: |
          version="${GITHUB_REF_NAME}"
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be strict semver like v1.2.3, got: ${version}" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
            echo "Version image already exists: ${IMAGE}:${version}" >&2
            exit 1
          fi
      - name: Build, scan, and push production image
        run: |
          version="${GITHUB_REF_NAME}"
          docker buildx build --pull \
            --cache-from type=gha \
            --cache-to type=gha,mode=min,ignore-error=true \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -f infra/docker/Dockerfile \
            -t "${IMAGE}:${version}" \
            -t "${IMAGE}:latest" \
            --output type=image,push=true,oci-mediatypes=false \
            --load \
            .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e \
            image --scanners vuln --exit-code 1 --ignore-unfixed --severity CRITICAL \
            "${IMAGE}:${version}"
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"
      - name: Mirror production image to GitHub Container Registry
        env:
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/reven"
          version="${GITHUB_REF_NAME}"
          printf '%s' "$GHCR_PASSWORD" | \
            docker login ghcr.io --username "${GITHUB_REPOSITORY_OWNER}" --password-stdin
          docker tag "${IMAGE}:${version}" "${ghcr_image}:${version}"
          docker tag "${IMAGE}:${version}" "${ghcr_image}:latest"
          docker push "${ghcr_image}:${version}"
          docker push "${ghcr_image}:latest"
      - name: Generate SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e \
            image --scanners vuln --format cyclonedx \
            --output /work/reven-sbom.cdx.json "${IMAGE}:${GITHUB_REF_NAME}"
      - id: push
        name: Resolve immutable image digest
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          printf 'image=%s@%s\n' "$IMAGE" "$digest" >>"$GITHUB_OUTPUT"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reven-${{ github.sha }}-release-evidence
          path: reven-sbom.cdx.json

  deploy:
    if: >-
      always() && (
      (github.event_name == 'push' && needs.image.result == 'success') ||
      (github.event_name == 'workflow_dispatch'))
    needs: [image]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to Alibaba ACR for manual deploy
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
        env:
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
        run: |
          printf '%s' "$ACR_PASSWORD" | \
            docker login registry.cn-hangzhou.aliyuncs.com \
              --username "$ACR_USERNAME" --password-stdin
      - id: target
        name: Resolve deployment target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
          PUSH_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if [ "$OPERATION" = rollback ]; then
            echo 'operation=rollback' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PUSH_IMAGE" ]; then
            image="$PUSH_IMAGE"
          else
            version="${INPUT_VERSION:-latest}"
            digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
            image="${IMAGE}@${digest}"
          fi
          printf 'operation=deploy\nimage=%s\n' "$image" >>"$GITHUB_OUTPUT"
      - name: Configure SSH transport
        env:
          DEPLOY_KEY: ${{ secrets.REVEN_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.REVEN_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Install and run restricted deployment script
        env:
          DEPLOY_HOST: ${{ secrets.REVEN_DEPLOY_SSH_HOST }}
          DEPLOY_IMAGE: ${{ steps.target.outputs.image }}
          DEPLOY_OPERATION: ${{ steps.target.outputs.operation }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "kk@${DEPLOY_HOST}" 'install -d -m 755 /opt/reven/scripts'
          scp -i ~/.ssh/id_ed25519 scripts/deploy_reven.sh \
            "kk@${DEPLOY_HOST}:/opt/reven/scripts/deploy_reven.sh"
          ssh -i ~/.ssh/id_ed25519 "kk@${DEPLOY_HOST}" \
            "chmod 755 /opt/reven/scripts/deploy_reven.sh && \
            DEPLOY_OPERATION='${DEPLOY_OPERATION}' REVEN_IMAGE='${DEPLOY_IMAGE}' \
            /opt/reven/scripts/deploy_reven.sh"
      - name: Notify Feishu
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_NOTIFY_OPEN_IDS: ${{ secrets.FEISHU_NOTIFY_OPEN_IDS }}
          DEPLOY_IMAGE: ${{ steps.target.outputs.image || 'previous healthy image' }}
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/notify_feishu_deploy.py
