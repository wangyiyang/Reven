services:
  reven:
    image: ${REVEN_IMAGE:?REVEN_IMAGE must be a full Alibaba ACR sha256 digest, tags are forbidden}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # DSH_HOME：dsh 运行时数据目录（profile/会话日志），由 dsh-data 卷持久化。
      # 注意：agent-llm 的 api_key 走前端集成页配置（加密入库），不通过 env 注入。
      DSH_HOME: /data/dsh
      # HOME：read_only 根文件系统下 dsh boot 需在 $HOME/.cache/pkg 建插件缓存目录，须指向可写卷（#151 同款修复）。
      HOME: /data/dsh
    volumes:
      - reven-data:/data
      - dsh-data:/data/dsh
      - reven-static:/srv/reven
    read_only: true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    restart: unless-stopped
    depends_on:
      reven:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - reven-static:/srv/reven:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    # Caddy 官方镜像给 /usr/bin/caddy 打了 cap_net_bind_service=ep 的 filecap；
    # bounding set 缺该 cap 时 execve 直接 EPERM，容器无法启动。即使入口是
    # 非特权端口 3001，此 cap 也必须保留作为 exec 前提，删除会导致崩溃循环。
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  reven-data:
  dsh-data:
  reven-static:
  caddy-data:
  caddy-config:
