services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: reven
      POSTGRES_USER: reven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD before starting}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, pg_isready -U reven -d reven]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  agent:
    image: ${REVEN_IMAGE:?REVEN_IMAGE must be a full Alibaba ACR sha256 digest, tags are forbidden}
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "reven.agent.worker"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://reven:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD before starting}@postgres:5432/reven
      DSH_HOME: /data/dsh
      WORKSPACE_ROOT: /workspace
      HOME: /data/dsh
      REVEN_AGENT_MCP_URL: http://reven:8000/agent/mcp
    volumes:
      - /opt/reven/workspace:/workspace:rw
      - dsh-data:/data/dsh:rw
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/agent/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  reven:
    image: ${REVEN_IMAGE:?REVEN_IMAGE must be a full Alibaba ACR sha256 digest, tags are forbidden}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://reven:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD before starting}@postgres:5432/reven
      AGENT_WORKER_URL: http://agent:8001
      WORKSPACE_ROOT: /workspace
    volumes:
      - reven-data:/data
      - reven-static:/srv/reven
      - /opt/reven/workspace/downloads:/workspace/downloads:rw
    read_only: true
    mem_limit: 1.5g
    cpus: 1.5
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      reven:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - reven-static:/srv/reven:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  reven-data:
  dsh-data:
  reven-static:
  caddy-data:
  caddy-config:
