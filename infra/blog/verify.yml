# Install this file as .github/workflows/reven-jekyll.yml in the blog repository
# through a reviewed PR, then configure the "Jekyll build" check as required.
name: Jekyll build

on:
  pull_request:
    paths:
      - "_posts/**"
      - "images/posts/**"
      - "Gemfile"
      - "Gemfile.lock"

permissions:
  contents: read

concurrency:
  group: reven-jekyll-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Jekyll build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - name: Jekyll build
        run: bundle exec jekyll build --trace
