services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: reven-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: reven
      POSTGRES_USER: reven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD before starting}
    volumes:
      - reven-postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, pg_isready -U reven -d reven]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  reven-postgres-data:
