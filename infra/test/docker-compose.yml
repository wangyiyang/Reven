services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reven_test
      POSTGRES_USER: reven_test
      POSTGRES_PASSWORD: reven_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reven_test -d reven_test"]
      interval: 2s
      timeout: 2s
      retries: 20
