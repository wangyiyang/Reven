# dsh sdk profile patch（#123）：注入 Reven MCP 工具通道，并关闭 IM 机器人场景不需要的内建 coding 工具。
# 由 AgentRuntime 经 DeepSeekHarness(patches=...) 以绝对路径传入。
# url / Authorization 在 dsh 进程内由 !!js 表达式读取 REVEN_AGENT_MCP_URL / REVEN_AGENT_MCP_TOKEN，
# 两个变量由 AgentRuntime 注入子进程 env——真实凭证不落盘、不进 git。
- insert:
    - id: mcp-reven
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: reven
        transport: streamable-http
        url: !!js process.env.REVEN_AGENT_MCP_URL
        headers:
          Authorization: !!js '"Bearer " + process.env.REVEN_AGENT_MCP_TOKEN'
        toolCallTimeoutMs: 30000
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-jobs
  disabled: true
# 行为指令（#153）：覆盖 sdk profile 既有 system-prompt 条目。
# 注意：patch 对条目 config 是整体替换语义，sdk 原有的 personaPrefix 会被静默丢弃，
# 因此 personaPrefix（与 sdk 原文一致，保留 {{model}} 占位）与 personaSuffix 都必须显式列出。
# personaSuffix 保留 {{cwd}} 占位（原条目语义），并追加 RSS 关键词维护的话术与确认约束。
- id: system-prompt
  config:
    personaPrefix: You are a coding agent powered by the {{model}} model.
    personaSuffix: |-
      Your working directory is {{cwd}}.
      你可以通过 mcp__reven__rss_keyword_* 工具帮用户维护 RSS 筛选关键词。行为约束：
      1. 调用 rss_keyword_delete 之前，必须先向用户复述确认关键词内容、正向/反向属性和 ID，用户明确确认后才可执行删除；停用或启用关键词无需确认。
      2. 每次新增、删除或修改关键词后，回复必须说明：关键词按语义匹配生效（非精确匹配），且从下次每日抓取起对新条目生效。
      3. 新增关键词后，回复必须引用工具返回的 hit_count（当前条目库的语义命中数估计）；hit_count 为 null 时说明暂时无法估计命中数。
      4. 工具返回 embedding_status 为 pending 时，必须告知用户关键词已保存、语义匹配将在 embedding 补齐后生效（下轮每日抓取自动兜底）。
