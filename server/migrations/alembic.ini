# Reven — Alembic 配置

[alembic]
script_location = server/migrations

# 默认 version_locations 为 {script_location}/versions
# 表前缀命名约定: {module}_{rev}_{desc}.py

# SQLAlchemy URL (会被 env.py 中的配置覆盖)
sqlalchemy.url = postgresql+asyncpg://reven:reven@localhost:5432/reven

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
