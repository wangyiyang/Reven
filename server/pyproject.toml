[project]
name = "reven-server"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "Wang Yiyang" }]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5",
  "cos-python-sdk-v5>=1.9,<2",
  "cryptography>=45,<46",
  "deepseek-harness-sdk>=0.1.5rc1,<0.2",
  "fastapi>=0.116,<1",
  "fastmcp>=4,<5",
  "httpx>=0.28,<1",
  "httpcore>=1.0.9,<2",
  "lark-oapi>=1.4,<2",
  "markdown-it-py>=3,<4",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reven"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "reven/LICENSE"
