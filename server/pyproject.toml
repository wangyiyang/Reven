[project]
name = "reven-server"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "Wang Yiyang" }]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5",
  "cos-python-sdk-v5>=1.9,<2",
  "cryptography>=45,<46",
  "fastapi>=0.116,<1",
  "fastmcp>=4,<5",
  "httpx>=0.28,<1",
  "httpcore>=1.0.9,<2",
  "langchain>=1.4.3,<1.5",
  "langchain-core>=1.6.6,<1.7",
  "langchain-deepseek>=1.1.1,<1.2",
  "langchain-openai>=1.6.7,<1.7",
  "langgraph>=1.2.13,<1.3",
  "langgraph-checkpoint-postgres>=3.1.2,<3.2",
  "lark-oapi>=1.4,<2",
  "psycopg[binary]>=3.3.6,<3.4",
  "psycopg-pool>=3.3.3,<3.4",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "agent-runtime-pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
langchain = { index = "agent-runtime-pypi" }
langchain-core = { index = "agent-runtime-pypi" }
langchain-deepseek = { index = "agent-runtime-pypi" }
langchain-openai = { index = "agent-runtime-pypi" }
langgraph = { index = "agent-runtime-pypi" }
langgraph-checkpoint-postgres = { index = "agent-runtime-pypi" }
psycopg = { index = "agent-runtime-pypi" }
psycopg-pool = { index = "agent-runtime-pypi" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reven"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "reven/LICENSE"
