[project]
name = "reven"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["server"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reven"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server/src"]
addopts = "-q"
